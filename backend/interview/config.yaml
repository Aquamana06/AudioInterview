# 会話量や終了タイミングの調整用。深さの段階定義や抽出スキーマはコードで管理。
history:
  messages: 30
  known_facts: 30
  asked_points: 30
  persona_notes: 20
  prompt_facts: 15
  prompt_questions: 12
profile:
  max_turns: 14
  min_turns: 7
  min_covered_fields: 5
ending:
  max_turns: 20
  min_task_coverage: 0.45
  min_irregular_coverage: 0.6
  partial_irregular_coverage: 0.4
  partial_irregular_turns: 3
  high_depth: 5
  high_depth_turns: 2
  complete_task_coverage: 1.0
  complete_depth: 6
  complete_irregular_coverage: 0.6
guidance:
  stagnation_turns: 4
retrieval:
  task_sessions: 3
  message_chars: 180
  summary_chars: 600
  task_context_chars: 5000
  items: 12
  summaries: 6
  confidence_weight: 0.25
  starter_max_chars: 140
scoring:
  fram_increment: 0.05
  fram_cap: 0.1
  # 0より大きい FRAM 項目数に応じたボーナス合計（段階ごとに累積加算しない）。
  fram_bonuses: {2: 0.05, 3: 0.1, 4: 0.2, 5: 0.2, 6: 0.4}
  irregular_stage_increment: 0.2
  friction_penalty: 0.12
  resistance_penalty: 0.05
  information_rapport_increment: 0.03
  reflection_rapport_increment: 0.04
