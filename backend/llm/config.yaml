# モデル ID はローカルディレクトリにも変更可能。
model: Qwen/Qwen3.6-27B
device_map: cuda:0
dtype: bfloat16
# 27B を Whisper と同じ 32GB GPU に常駐させるため、重みを 4bit に量子化。
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
max_input_tokens: 8192
enable_thinking: false
generation:
  max_new_tokens: 2048
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
# 要約・構造化抽出は通常の質問文より長いため、別の出力枠を使う。
json_generation:
  max_new_tokens: 4096
  do_sample: false
